<div class="col-3">
  <ul>
    @for (item of employeeList.value(); track $index) {
      <li>{{item.name}} - {{item.position}}</li>
    }
  </ul>
</div>
<div class="container">
  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered align-middle text-center">
      <thead class="table-dark">
        <tr>
          <th>Sl. No</th>
          <th>Name</th>
          <th>position</th>
          <th>Salary</th>
          <th>Department</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (emp of employeeList.value(); track $index) {
          <tr>
            <td>{{ $index + 1 }}</td>
            <td>{{ emp.name }}</td>
            <td>{{ emp.position }}</td>
            <td>{{ emp.salary }}</td>
            <td>{{ emp.department }}</td>
            <td>
              <button class="btn btn-warning" (click)="OnEdit(emp)">Edit</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
