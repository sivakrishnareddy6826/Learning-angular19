<div class="login-container d-flex align-items-center justify-content-center">
  <div class="login-card shadow-lg p-4 rounded-4">
    <h3 class="text-center mb-4 fw-bold">Welcome Back</h3>

    <form (ngSubmit)="onLogin()" [formGroup]="loginForm">
      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          class="form-control form-control-lg"
          formControlName="email"
          type="email"
          placeholder="Enter your email"
        />
        <div class="text-danger small" *ngIf="email.invalid && email.touched">
          Valid email is required.
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          class="form-control form-control-lg"
          formControlName="password"
          type="password"
          placeholder="Enter your password"
        />
        <div
          class="text-danger small"
          *ngIf="password.invalid && password.touched"
        >
          Password is required.
        </div>
      </div>

      <!-- Login Button -->
      <button
        class="btn btn-primary w-100 btn-lg mt-2"
        [disabled]="loginForm.invalid"
      >
        Login
      </button>

      <!-- Footer -->
      <p class="text-center mt-3 text-muted small">
        © {{ currentYear }} Angular & Dotnet Core
      </p>
    </form>
  </div>
</div>
